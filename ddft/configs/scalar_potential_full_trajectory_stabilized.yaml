# Stabilized retest of scalar_potential_full_trajectory.yaml (single-
# potential 3a, chunk_fraction=1.0), which went to exact NaN weights at
# epoch 125 (5 epochs into window_size=35) - the SECOND of three
# independent NaN-at-window_size=35-onset incidents).
# Partial (epoch-120) results from that run were notably better than the
# surviving baseline (restricted-chunk) scalar-potential config on
# density (+25.4% vs +206.2%), echoing the same full-coverage-helps-
# density pattern already found for the vector-force case - strong
# enough evidence to justify trying to stabilize this rather than
# abandoning it.
#
# Three combined, independently-motivated countermeasures (per-change
# effect not separately ablated yet - this is a bundled first retest):
#   1. potential_smooth_sigma: 1.5 - fixed Gaussian blur on the raw
#      potential field before spatial_gradient, direct countermeasure to
#      the hypothesis that differentiation amplifies high-frequency
#      content in the network's output (matches the MD data's own
#      smoothing sigma for consistency).
#   2. Gentler ramp into the long-horizon phase: inserted an intermediate
#      window_size=25 stage (was 15 -> 35 directly) with its own reduced
#      lr, and dropped window_size=35's lr further (1e-4 -> 5e-5).
#   3. Small, TARGETED weight_decay (1e-6) applied ONLY during the
#      window_size=35 phases (already phase-configurable, zero code
#      change) - NOT a repeat of the project's original weight_decay=1e-4
#      mistake (that was global and 100x larger; this is phase-scoped and
#      small enough to provide damping without repeating that failure).
run_id: scalar_potential_full_trajectory_stabilized/3a
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true
  use_potential_output: true
  potential_smooth_sigma: 1.5

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3
chunk_fraction: 1.0

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 25, batch_size: 2, lr: 1.5e-4, stride: 10}
  - {epochs: 10, window_size: 25, batch_size: 2, lr: 1.5e-4, stride: 10}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 5.0e-5, stride: 15, weight_decay: 1.0e-6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 5.0e-5, stride: 15, weight_decay: 1.0e-6}
