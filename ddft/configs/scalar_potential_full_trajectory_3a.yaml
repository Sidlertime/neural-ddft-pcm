# Scalar F_sup + full-trajectory-coverage sampling, single-potential 3a.
# Identical to full_trajectory_sampling_3a.yaml except model_kwargs adds
# use_potential_output: true. Tests whether the scalar-potential/
# conservative-force variant needs the same better-data-coverage recipe to
# achieve a clean dual-metric win that the vector-force variant did
# (scalar_potential_3a.yaml, using the standard resampled-chunk recipe,
# showed a much worse density regression than v7a's vector-force baseline).
run_id: scalar_potential_full_trajectory/3a
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true
  use_potential_output: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3
chunk_fraction: 1.0

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
