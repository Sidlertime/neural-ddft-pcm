# v6: exclude-ref_3b multi-potential hybrid training - weight_decay FIX.
#
# CRITICAL FINDING: v2, v3, and v4 all show net.0.weight (SuperadiabaticNet's
# first conv layer) decaying exponentially to a hard float32 zero within the
# first ~40-80 epochs, independent of chunk strategy or input channels. Once
# that layer is exactly zero, no gradient can flow back through it - the
# network is permanently dead, and everything we interpreted as "near-zero
# contribution" or "specialization" downstream was actually a byproduct of a
# collapsed network's residual bias-only output, not learned physics. Root
# cause: weight_decay=1e-4 outpaces the weak early-phase (window_size=2)
# gradient signal. v4's apparent "3a win" was confirmed to be a perfectly
# input-independent constant force (-0.00398 everywhere, every time, every
# potential) - not a real correction.
#
# Fix tested here: weight_decay -> 0.0. Everything else identical to v4
# (full 6-channel nuclear input set, resampled chunks, 12+2-phase
# curriculum, noise_std=0.001, eta=0.6944).
run_id: train_exclude_3b_v6
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_gaussian_langevin_01/avg_500/
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/
  - ../data/lj_data/ref_3d_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
