# Full-trajectory sampling coverage test: identical to v7a except
# chunk_fraction: 1.0 instead of the default 0.15. phase_chunk_indices()
# with chunk_fraction=1.0 returns the ENTIRE trajectory's indices every
# phase (chunk_size == full length, so there's no restricted sub-region at
# all) - window_size/BPTT depth is unchanged (still capped at 35), only the
# POOL of possible window start-positions widens from one ~15% chunk to the
# whole trajectory. Tests whether chunk-restriction was ever necessary once
# the network can actually learn (weight_decay=0), isolating exactly this
# one variable vs. v7a.
run_id: full_trajectory_sampling/3a
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3
chunk_fraction: 1.0

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
