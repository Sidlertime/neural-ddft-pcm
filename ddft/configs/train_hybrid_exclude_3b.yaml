# Exclude-ref_3b multi-potential hybrid training (see
# docs/ai_planning/2026-11-05_initialization_report.md and the plan that
# produced this run for context).
#
# ref_3b was found to be a chronic outlier in the full-5-potential smoke run
# (results/2026-11-05_smoke_stage_multi_potential_hybrid_01) - its force
# ratio climbed to ~300-500 and never recovered, dragging other potentials'
# ratios up too via the shared SuperadiabaticNet weights. This config trains
# on the remaining potentials minus ref_3b, holding out ref_3c (the
# structurally hardest remaining potential - two-peak, Vmax=8.24, closest in
# barrier height to the excluded ref_3b) as a generalization test.
#
# eta=0.6944 (NOT 0.67, used in train_hybrid_multi_potential.yaml) to match
# every existing equilibrium-mode baseline eval on disk, so results are
# directly comparable to those baselines.
run_id: train_exclude_3b
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_gaussian_langevin_01/avg_500/
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/
  - ../data/lj_data/ref_3d_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 1.0e-4
loss_weight_v: 10.0
noise_std: 1.0e-2

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
