# 6th potential: lj_sharp (data/lj_data/2026-02-26_lj_sharp_langevin_01/avg_500/),
# a tall single sharp barrier (Vmax=10.0, vs gaussian's Vmax=5.0), never used
# in this project before. Same 320-pt/dz=1/32 grid, full vz velocity field,
# directly loadable by MDWindowDataset with zero code changes.
#
# IMPORTANT: this MD was generated at Tdamp=100.0 (gamma=1/Tdamp=0.01), NOT
# the production Tdamp=10/gamma=0.1 used for gaussian/3a-3d - gamma below is
# set to match this potential's own MD ground truth, not copy-pasted from
# channel_ablation_3a_base.yaml.
#
# Otherwise identical recipe to channel_ablation_3a_base.yaml (this week's
# proven-good single-potential clean-win recipe): weight_decay=0,
# noise_std=0.001, loss_weight_v=10, same 14-phase curriculum.
run_id: lj_sharp_base
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/2026-02-26_lj_sharp_langevin_01/avg_500/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs: {}

k: 1.0
T: 2.0
m: 1.0
gamma: 0.01
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
