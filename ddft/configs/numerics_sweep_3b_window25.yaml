# Window-size staging: 3b, otherwise-default numerics (rho_floor=1e-6, dt=1e-4),
# with an intermediate window_size=25 curriculum phase inserted before the usual
# window_size=35 jump (pattern proven in scalar_potential_mixed_chunked_stabilized.yaml).
# Tests whether curriculum smoothing alone helps 3b's chronic instability,
# independent of the rho_floor/dt numerics axis tested in the sibling sweep configs.
run_id: numerics_sweep/3b_window25
seed: 42
model_mode: hybrid
md_paths: [../data/lj_data/ref_3b_langevin_01/avg_2000/]
base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null
model_kwargs: {use_vext: true, use_rho_prev: true, use_v_prev: true, use_accel: true,
  use_gamma: true, use_eta: true}
k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 0.0001
weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 0.001
curriculum:
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 10, window_size: 25, batch_size: 2, lr: 0.00015, stride: 10}
- {epochs: 10, window_size: 25, batch_size: 2, lr: 0.00015, stride: 10}
- {epochs: 20, window_size: 35, batch_size: 1, lr: 0.0001, stride: 15}
- {epochs: 20, window_size: 35, batch_size: 1, lr: 0.0001, stride: 15}
