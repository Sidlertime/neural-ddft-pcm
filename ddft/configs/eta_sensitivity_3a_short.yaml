# Short-curriculum clone of v7a (train_hybrid_3a_only_v7a_lw10.yaml), for a
# quick eta-sensitivity check (2026-11-08): does the new Green-Kubo eta
# estimate (0.8053+/-0.0698, see reference_mdext_ddft.md) change training
# behavior or trained-model predictions enough to warrant redoing the full
# project sweep? Truncated to ~1/6 the epoch count of v7a but still covers
# all 4 window sizes (2/5/15/35) since several project findings show
# behavior differences only emerge at the long-window phases.
#
# `eta` itself is overridden via --eta CLI flag at launch time (old vs new),
# everything else held fixed so eta is the only varying factor.
run_id: eta_sensitivity_3a_short
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3

curriculum:
  - {epochs: 5, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 5, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 5, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
