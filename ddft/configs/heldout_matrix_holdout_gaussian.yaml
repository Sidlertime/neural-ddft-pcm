# Heldout-combination matrix: train on {3a, 3c, 3d}, hold out gaussian.
# Same full-trajectory-coverage mixed recipe as mixed_full_trajectory.yaml
# (which held out 3c) - completes the matrix testing whether "it
# generalizes" is robust to WHICH potential is held out. gaussian was the
# original breakthrough single-potential dataset and the structurally
# simplest potential (single well) - this tests generalization FROM a mix
# of harder/more complex potentials TO the simplest one, the reverse
# direction of the usual "simple generalizes to hard" story.
run_id: heldout_matrix/holdout_gaussian_train
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/
  - ../data/lj_data/ref_3c_langevin_01/avg_2000/
  - ../data/lj_data/ref_3d_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3
chunk_fraction: 1.0

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
