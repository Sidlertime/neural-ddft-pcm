# G1 (grounding runs, 2026-11-16): mg1 with 2x density weight (w_rho=39.4,
# up from 19.72), otherwise identical to retrain_mg1_density_weighted.yaml.
# Tests whether mg1 (the one potential whose self-eval density stayed flat,
# +2.5%, at the epoch-1-derived weight) was simply under-weighted, mirroring
# gaussian's own 2x-strengthening story (+2.8% -> -5.6% at gamma=0.1).
run_id: final_wave/G1_mg1_2x_density
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_mg1_langevin_01/avg_500/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4
force_alpha: 1.0
frame_interval: 0.01

weight_decay: 0.0
loss_weight_v: 1.0
loss_weight_rho: 39.4
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 1, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 1, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 5, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 10, batch_size: 2, lr: 1.0e-4, stride: 10}
  - {epochs: 10, window_size: 10, batch_size: 2, lr: 1.0e-4, stride: 10}
