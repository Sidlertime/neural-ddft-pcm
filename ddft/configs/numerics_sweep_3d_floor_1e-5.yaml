# Numerics sweep: 3d, rho_floor=1e-05, dt=0.0001 (varying one axis from the
# numerics_sweep_3d_baseline.yaml baseline). Tests whether the 1/rho singularity
# in the viscosity/pressure terms (confirmed at force_factory.py/phiflow_pde.py)
# is what drives 3d's chronic window_size=35 instability.
run_id: numerics_sweep/3d_floor_1e-5
seed: 42
model_mode: hybrid
md_paths: [../data/lj_data/ref_3d_langevin_01/avg_2000/]
base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null
model_kwargs: {use_vext: true, use_rho_prev: true, use_v_prev: true, use_accel: true,
  use_gamma: true, use_eta: true}
k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 0.0001
rho_floor: 1.0e-05
weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 0.001
curriculum:
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 2, batch_size: 8, lr: 0.001, stride: 1}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 5, batch_size: 8, lr: 0.0005, stride: 2}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 10, window_size: 15, batch_size: 4, lr: 0.0002, stride: 6}
- {epochs: 20, window_size: 35, batch_size: 1, lr: 0.0001, stride: 15}
- {epochs: 20, window_size: 35, batch_size: 1, lr: 0.0001, stride: 15}
