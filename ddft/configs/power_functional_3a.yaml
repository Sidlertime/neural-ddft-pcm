# Power-functional baseline comparison: single-potential 3a, otherwise an
# exact copy of train_hybrid_3a_only_v7a_lw10.yaml's recipe (same curriculum/
# weight_decay/loss_weight_v/noise_std), but model_mode: hybrid_power
# (PowerFunctionalNet predicting a true scalar excess power functional
# P^ex[rho,v], force recovered via f_sup = -(1/rho)*dP^ex/dv - see
# force_factory.py:get_hybrid_power_force). One deliberate deviation from
# v7a's exact channel set: use_accel is OMITTED - confirmed via
# tests/test_power_functional.py that accel's raw magnitude (~1000 at this
# project's dt=1e-4) overflows to NaN under the double-backward this
# architecture's force computation requires (unlike SuperadiabaticNet, which
# never needs a second derivative through its own forward pass). A clamp
# inside PowerFunctionalNet.forward() fixes this for accel specifically, but
# dropping it entirely for this first baseline run keeps the test as clean
# as possible. This is the ONE controlled comparison deciding whether to
# invest further.
run_id: power_functional_3a
seed: 42
model_mode: hybrid_power

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null
power_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: false
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
