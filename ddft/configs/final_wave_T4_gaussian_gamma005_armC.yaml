# T4 (final wave, 2026-11-16): gaussian at gamma=0.05, density-weighted loss
# reused unchanged from the gamma=0.1 armC derivation (w_rho=37.4, w_v=1,
# see nightshift_gaussian_armC_density_weighted_2x.yaml) - not re-derived for
# gamma=0.05. gamma=0.05 here is the
# PHYSICAL friction used both in the PDE and matching the MD data's own
# gamma (ref_gaussian_gamma005_langevin_01) - this is a same-gamma retrain,
# not a cross-gamma transfer test (that's E3-E6 below, using the gamma=0.1-
# trained armB/armC models zero-shot on gamma=0.05/0.5 data instead).
run_id: final_wave/T4_gaussian_gamma005_armC
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_gaussian_gamma005_langevin_01/avg_500/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.05
eta: 0.6944
dt: 1.0e-4
force_alpha: 1.0
frame_interval: 0.01

weight_decay: 0.0
loss_weight_v: 1.0
loss_weight_rho: 37.4
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 1, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 1, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 5, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 10, batch_size: 2, lr: 1.0e-4, stride: 10}
  - {epochs: 10, window_size: 10, batch_size: 2, lr: 1.0e-4, stride: 10}
