# Loss-weight annealing: loss_weight_v=10 for the short-window phases
# (establish the velocity correction early/cheaply), tapering down to 3
# then 1 for the window_size=15/35 phases (let density catch up once the
# velocity correction is established) - testing whether this recovers an
# even better density result than v7a's flat lw=10 throughout, per the
# channel-ablation finding (Section 4 concept notes) that density is the
# metric most sensitive to weighting/inputs. Uses per-phase loss_weight_v
# override (train_phiflow.py already supports phase.get("loss_weight_v",
# base_loss_weight_v) - no code change needed). Single-potential 3a,
# weight_decay=0, otherwise identical recipe/curriculum to v7a.
run_id: loss_weight_anneal/3a
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2, loss_weight_v: 10.0}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2, loss_weight_v: 5.0}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2, loss_weight_v: 5.0}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6, loss_weight_v: 3.0}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6, loss_weight_v: 3.0}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6, loss_weight_v: 3.0}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15, loss_weight_v: 1.0}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15, loss_weight_v: 1.0}
