# Mixed multi-potential hybrid training (Neural DDFT milestone).
#
# Trains the SuperadiabaticNet correction on a dataset mixing the Gaussian
# well and all four Karnik reference potentials simultaneously, instead of
# one potential's trajectory chunk at a time, to harden generalization.
run_id: train_multi_potential
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_gaussian_langevin_01/avg_500/
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/
  - ../data/lj_data/ref_3b_langevin_01/avg_2000/
  - ../data/lj_data/ref_3c_langevin_01/avg_2000/
  - ../data/lj_data/ref_3d_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

# Physics parameters
k: 1.0
T: 2.0
m: 1.0
gamma: 0.1   # Friction coefficient (1.0 / Tdamp in LJ units) - see mdext_ddft for derivation
eta: 0.67    # Shear viscosity (LJ units) - see mdext_ddft for derivation
dt: 1.0e-4

# Training parameters
weight_decay: 1.0e-4
loss_weight_v: 10.0
noise_std: 1.0e-2

# "Continuous Multi-Start Shifting Chunks" curriculum: each phase holds one
# fresh random 15% chunk PER POTENTIAL (see MultiPotentialMDDataset.phase_chunk_indices)
# for its listed number of epochs before the next phase draws new chunks.
curriculum:
  # one step prediction
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  # small window
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  # medium horizon - stops at window 15 (earlier attempt):
  # window 35 caused gradient interference from thermal noise and flatlined learning.
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
