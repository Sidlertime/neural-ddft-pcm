# Chunk position ablation: fixed chunk at the MIDDLE of the trajectory
# (start_fraction=0.4), chunk_fraction=0.15 (standard 15% size, not full
# coverage), held fixed across the whole curriculum (not resampled).
# Single-potential 3a, weight_decay=0, loss_weight_v=10, same 14-phase
# curriculum as v7a - isolates chunk POSITION as the only variable
# (distinct from v3, which tested position 0.4 but with a different,
# collapsed grad_quarter-matched curriculum and the weight_decay bug active).
run_id: chunk_position/middle
seed: 42
model_mode: hybrid

md_paths:
  - ../data/lj_data/ref_3a_langevin_01/avg_2000/

base_model_path: models/c2_dz32.ckpt
sup_model_path: null
zimmermann_model_path: null

model_kwargs:
  use_vext: true
  use_rho_prev: true
  use_v_prev: true
  use_accel: true
  use_gamma: true
  use_eta: true

k: 1.0
T: 2.0
m: 1.0
gamma: 0.1
eta: 0.6944
dt: 1.0e-4

weight_decay: 0.0
loss_weight_v: 10.0
noise_std: 1.0e-3
chunk_fraction: 0.15
chunk_start_fraction: 0.4

curriculum:
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 2, batch_size: 8, lr: 1.0e-3, stride: 1}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 5, batch_size: 8, lr: 5.0e-4, stride: 2}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 10, window_size: 15, batch_size: 4, lr: 2.0e-4, stride: 6}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
  - {epochs: 20, window_size: 35, batch_size: 1, lr: 1.0e-4, stride: 15}
