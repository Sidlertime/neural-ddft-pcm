[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ddft"
version = "0.1.0"
description = "Neural Differentiable Dynamic Density Functional Theory solver"
dependencies = [
    "torch",
    "numpy",
    "h5py",
    "matplotlib",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]